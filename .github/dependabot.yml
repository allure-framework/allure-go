version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/commons"
      - "/testify"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    labels:
      - "pr:dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    labels:
      - "pr:dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
