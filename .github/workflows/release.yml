name: Release
run-name: Release v${{ inputs.releaseVersion }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Release version without v prefix, for example 0.1.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GIT_COMMIT_AUTHOR_EMAIL: ${{ vars.ALLURE_CI_APP_USER_ID }}+${{ vars.ALLURE_CI_APP_SLUG }}[bot]@users.noreply.github.com
      GIT_COMMIT_AUTHOR_NAME: ${{ vars.ALLURE_CI_APP_SLUG }}[bot]
      RELEASE_VERSION: ${{ inputs.releaseVersion }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ALLURE_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.ALLURE_CI_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "${GIT_COMMIT_AUTHOR_NAME}"
          git config user.email "${GIT_COMMIT_AUTHOR_EMAIL}"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            **/go.mod
            **/go.sum

      - name: Validate inputs
        shell: bash
        run: |
          [ "${GITHUB_REF_TYPE}" = "branch" ]
          [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

      - name: Prepare release modules
        run: ./.github/scripts/prepare-release-modules.sh "${RELEASE_VERSION}"

      - name: Check formatting
        shell: bash
        run: |
          while IFS= read -r module_dir || [ -n "${module_dir}" ]; do
            unformatted="$(gofmt -l "${module_dir}")"
            if [ -n "${unformatted}" ]; then
              printf 'gofmt is required for:\n%s\n' "${unformatted}"
              exit 1
            fi
          done < .release-modules

      - name: Vet
        shell: bash
        run: |
          while IFS= read -r module_dir || [ -n "${module_dir}" ]; do
            (cd "${module_dir}" && go vet ./...)
          done < .release-modules

      - name: Lint
        shell: bash
        run: |
          while IFS= read -r module_dir || [ -n "${module_dir}" ]; do
            (cd "${module_dir}" && go run github.com/mgechev/revive@v1.15.0 \
              -config "${GITHUB_WORKSPACE}/revive.toml" \
              -set_exit_status \
              ./...)
          done < .release-modules

      - name: Test
        shell: bash
        run: |
          while IFS= read -r module_dir || [ -n "${module_dir}" ]; do
            (cd "${module_dir}" && go test -count=1 ./...)
          done < .release-modules

      - name: Commit release dependency pins
        shell: bash
        run: |
          mapfile -t changed_files < <(git status --porcelain -- '**/go.mod' '**/go.sum' go.work go.work.sum | sed 's/^...//')
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No release dependency changes to commit"
            exit 0
          fi

          git add -- "${changed_files[@]}"
          git commit -m "chore: prepare v${RELEASE_VERSION} release"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Create tags
        shell: bash
        run: |
          : > .release-tags
          git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1 > .release-previous-tag
          release_tag="v${RELEASE_VERSION}"

          if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
            echo "Tag ${release_tag} already exists"
            exit 1
          fi

          git tag "${release_tag}"
          printf '%s\n' "${release_tag}" >> .release-tags

          while IFS= read -r module_dir || [ -n "${module_dir}" ]; do
            if [ "${module_dir}" = "." ]; then
              continue
            else
              tag="${module_dir}/v${RELEASE_VERSION}"
            fi

            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Tag ${tag} already exists"
              exit 1
            fi

            git tag "${tag}"
            printf '%s\n' "${tag}" >> .release-tags
          done < .release-modules

          mapfile -t tags < .release-tags
          git push origin "${tags[@]}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          release_tag="v${RELEASE_VERSION}"
          args=("${release_tag}" --title "${release_tag}" --generate-notes --verify-tag)

          if [ -s .release-previous-tag ]; then
            args+=(--notes-start-tag "$(cat .release-previous-tag)")
          fi

          gh release create "${args[@]}"
